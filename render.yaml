# Reference for the existing service; this file does not bind a manually created service.
# Do not create another service or deploy automatically. See docs/CONFIGURATION-STANDARD.md.
services:
  - type: web
    name: NoteTatCa
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health/ready
    autoDeployTrigger: "off"
    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      - key: DATABASE__PROVIDER
        value: PostgreSQL
      - key: CONNECTIONSTRINGS__MYCNN
        sync: false
      - key: JWTSETTINGS__KEY
        sync: false
      - key: CORS__ALLOWEDORIGINS__0
        value: https://note-tat-ca.vercel.app
      - key: APPSETTINGS__CLIENTURL
        value: https://note-tat-ca.vercel.app
      - key: BACKGROUNDJOBS__ENABLED
        value: "true"
      - key: SUPABASE__URL
        value: https://nxqupzwqawujtgeuvvcj.supabase.co
      # Reserved server credential; upload endpoints/bucket are not implemented yet.
      - key: SUPABASE__SERVICE_KEY
        sync: false
