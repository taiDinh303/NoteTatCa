name: NoteTatCa frontend verification
on:
  push:
    paths: ["ntc_react/**", "ntc_aspnet/**", "tools/FrontendFixture/**", ".github/workflows/frontend.yml"]
  pull_request:
    paths: ["ntc_react/**", "ntc_aspnet/**", "tools/FrontendFixture/**", ".github/workflows/frontend.yml"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    defaults:
      run:
        working-directory: ntc_react
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: ntc_react/package-lock.json
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1
        with:
          dotnet-version: 8.0.x
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint -- --max-warnings 0
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e -- --shard=${{ matrix.shard }}/4
        env:
          CI: "true"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: frontend-verification-${{ matrix.shard }}
          path: |
            ntc_react/playwright-report/
            ntc_react/test-results/
            artifacts/frontend/
